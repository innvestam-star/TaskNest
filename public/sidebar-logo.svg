<svg
  width="420"
  height="120"
  viewBox="0 0 420 120"
  xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="tasknestTitle"
  role="img"
>
  <title id="tasknestTitle">TaskNest Logo</title>

  <!-- DEFINITIONS -->
  <defs>
    <linearGradient id="tasknestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#3FDAD7"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ICON -->
  <g transform="translate(20,20)">
    <!-- Calendar -->
    <rect
      x="10"
      y="10"
      width="60"
      height="60"
      rx="12"
      ry="12"
      fill="url(#tasknestGradient)"
    />

    <!-- Calendar rings -->
    <rect x="18" y="0" width="10" height="20" rx="5" fill="#3FDAD7"/>
    <rect x="35" y="0" width="10" height="20" rx="5" fill="#3FDAD7"/>
    <rect x="52" y="0" width="10" height="20" rx="5" fill="#3FDAD7"/>

    <!-- Checkmark -->
    <path
      d="M25 45 L35 55 L55 35"
      stroke="#FFFFFF"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Nest -->
    <path
      d="M0 70 C20 90, 60 90, 80 70"
      stroke="url(#tasknestGradient)"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M6 78 C26 92, 54 92, 74 78"
      stroke="url(#tasknestGradient)"
      stroke-width="4"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <!-- TEXT -->
  <text
    x="140"
    y="78"
    font-size="48"
    font-weight="600"
    font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    fill="url(#tasknestGradient)"
  >
    TaskNest
  </text>

</svg>
